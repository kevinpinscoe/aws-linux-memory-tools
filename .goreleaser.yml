# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: aws-linux-memory-tools
    main: .
    binary: aws-linux-memory-tools
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

archives:
  - id: aws-linux-memory-tools-archive
    ids: [aws-linux-memory-tools]
    name_template: "aws-linux-memory-tools-{{ .Os }}-{{ .Arch }}"
    formats: [binary]


nfpms:
  - id: aws-linux-memory-tools-packages
    package_name: aws-linux-memory-tools
    vendor: Kevin P. Inscoe
    homepage: https://github.com/kevinpinscoe/aws-linux-memory-tools
    maintainer: Kevin P. Inscoe <kevin.inscoe@gmail.com>
    description: AWS Linux memory diagnostics
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    ids: [aws-linux-memory-tools]

# `brews:` was deprecated in GoReleaser v2.10 and is slated for removal in
# v2.16. Casks cover Linux as well as macOS since Homebrew/brew#19121 added
# Linux binary support, so nothing is lost by moving off the formula.
# There is no cask equivalent of a formula `test do` block.
homebrew_casks:
  - name: aws-linux-memory-tools
    repository:
      owner: kevinpinscoe
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/kevinpinscoe/aws-linux-memory-tools
    description: AWS Linux memory diagnostics
    license: MIT

sboms:
  # Cataloguing the compiled binary rather than the source tree: syft reads the
  # Go build info baked into it, so the SBOM lists what actually shipped.
  # SBOMs land in checksums.txt, so the existing cosign signature covers them.
  - id: aws-linux-memory-tools-sbom
    artifacts: binary

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  # Build release notes from GitHub's compare API so entries link to their PRs
  # instead of printing bare 40-character commit SHAs.
  use: github
  sort: asc
  groups:
    # Security fixes lead so a reader can tell at a glance whether a release
    # carries one — this backs the supported-versions promise in SECURITY.md.
    - title: "⚠️ Security fixes"
      regexp: '(?i)^.*?(sec|vuln)(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Breaking changes"
      regexp: '(?i)^.*?[[:word:]]+(\([[:word:]]+\))?!:.+$'
      order: 1
    - title: "New features"
      regexp: '(?i)^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Bug fixes"
      regexp: '(?i)^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: kevinpinscoe
    name: aws-linux-memory-tools
  name_template: "v{{ .Version }}"
  make_latest: true
